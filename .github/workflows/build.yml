name: Build DevBuild
on:
    push:
        branches:
            - main
        paths:
            - .github/workflows/build.yml
            - src/**
            - browser/**
            - scripts/build/**
            - package.json
            - pnpm-lock.yaml
    workflow_dispatch:

env:
    FORCE_COLOR: true

permissions:
    contents: write

jobs:
    Build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6 # Install pnpm using packageManager key in package.json

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build web
              run: pnpm buildWebStandalone

            - name: Build
              run: pnpm build --standalone

            - name: Generate plugin list
              run: pnpm generatePluginJson dist/plugins.json dist/plugin-readmes.json

            - name: Clean up obsolete files
              run: |
                  rm -rf dist/*-unpacked dist/vendor Nightcord.user.css nightcordDesktopRenderer.css nightcordDesktopRenderer.css.map

            - name: Add installer to the release
              run: |
                  for f in installer/NightcordInstaller.bat installer/NightcordInstaller.ps1; do
                      sed "s/*$//" "$f" > "dist/$(basename "$f")"
                  done

            - name: Upload DevBuild as release
              # The standalone updater reads /releases/latest and takes the commit hash from the release title
              run: |
                  RELEASE_TAG=$(git rev-parse --short HEAD)
                  gh release view devbuild >/dev/null 2>&1 || \
                      gh release create devbuild --title "DevBuild $RELEASE_TAG" --notes "Automatic Nightcord build from the latest commit on main." --latest
                  gh release upload devbuild --clobber dist/*
                  gh release edit devbuild --title "DevBuild $RELEASE_TAG" --latest
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
