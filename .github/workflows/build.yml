name: Build DevBuild
on:
    push:
        branches:
            - main
        paths:
            - .github/workflows/build.yml
            - src/**
            - browser/**
            - scripts/build/**
            - installer/**
            - scripts/nightcord/buildInstaller.mjs
            - package.json
            - pnpm-lock.yaml
            - pnpm-workspace.yaml
    workflow_dispatch:

env:
    FORCE_COLOR: true

permissions:
    contents: write

concurrency:
    # promote.yml copies this release; never let the two overlap
    group: release
    cancel-in-progress: false

jobs:
    Build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6, installs pnpm from the packageManager key in package.json

            - name: Use Node.js 24
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm buildStandalone

            - name: Build the browser versions
              # userscript (Tampermonkey / Violentmonkey) and the Chrome and Firefox extensions
              run: pnpm buildWeb

            - name: Generate plugin list
              run: pnpm generatePluginJson dist/plugins.json

            - name: Collect files to be released
              run: |
                  mkdir -p dist/release
                  # desktop.asar is what the built-in updater downloads
                  cp dist/desktop.asar dist/plugins.json dist/release/
                  # Checked by the updater and installers before they use desktop.asar (fallback for GitHub's own asset digest)
                  (cd dist/release && sha256sum desktop.asar > desktop.asar.sha256)
                  # loose files keep older Nightcord installs (and the installer's local mode) working
                  cp dist/desktop/patcher.js dist/desktop/preload.js dist/desktop/renderer.js dist/desktop/renderer.css dist/release/

                  # browser: the userscript, its header alone (checked for updates, see @updateURL) and the extensions
                  cp dist/Nightcord.user.js dist/extension-chrome.zip dist/extension-firefox.zip dist/release/
                  sed -n '1,\#==/UserScript==#p' dist/Nightcord.user.js > dist/release/Nightcord.meta.js

                  for f in installer/NightcordInstaller.bat installer/NightcordInstaller.ps1; do
                      sed 's/\r*$/\r/' "$f" > "dist/release/$(basename "$f")"
                  done
                  (cd dist/release && zip -q NightcordInstaller.zip NightcordInstaller.bat NightcordInstaller.ps1)

            - name: Upload DevBuild as release
              # The updater takes the commit hash from the release title. devbuild is the beta channel: a pre-release
              # once the stable release exists (promote.yml copies builds there a day later); until then it is "latest"
              run: |
                  RELEASE_TAG=$(git rev-parse HEAD)
                  gh release view devbuild >/dev/null 2>&1 || \
                      gh release create devbuild --title "DevBuild $RELEASE_TAG" --notes "Automatic Nightcord build from the latest commit on main (beta)." --latest
                  gh release upload devbuild --clobber dist/release/*
                  if gh release view stable >/dev/null 2>&1; then
                      gh release edit devbuild --title "DevBuild $RELEASE_TAG" --prerelease --latest=false
                  else
                      gh release edit devbuild --title "DevBuild $RELEASE_TAG" --latest
                  fi
                  # Keep the release tag on the commit it was built from, so it never pins old history
                  git push --force origin "HEAD:refs/tags/devbuild"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    Installer:
        # The installer is a .NET Framework WinForms app, built with the C# compiler that ships with Windows
        needs: Build
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Use Node.js 24
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 24

            - name: Build NightcordInstaller.exe
              run: node scripts/nightcord/buildInstaller.mjs

            - name: Check that the installer downloads and verifies the new release
              shell: pwsh
              run: |
                  $p = Start-Process -FilePath dist\NightcordInstaller.exe -ArgumentList "--check", "$env:RUNNER_TEMP\check.txt", "devbuild" -Wait -PassThru
                  Get-Content "$env:RUNNER_TEMP\check.txt"
                  if ($p.ExitCode -ne 0) { exit 1 }

            - name: Upload installer to the release
              shell: pwsh
              run: |
                  $hash = (Get-FileHash -Algorithm SHA256 dist\NightcordInstaller.exe).Hash.ToLowerInvariant()
                  "$hash  NightcordInstaller.exe" | Set-Content -NoNewline -Encoding ascii dist\NightcordInstaller.exe.sha256
                  gh release upload devbuild --clobber dist\NightcordInstaller.exe dist\NightcordInstaller.exe.sha256
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
