name: test
on:
    push:
    pull_request:
        branches:
            - main
            - dev
    # for workflows that push to main: their pushes don't trigger other workflows, and promote.yml wants this run
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6, installs pnpm from the packageManager key in package.json

            - name: Use Node.js 24
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint & Test if desktop version compiles
              run: pnpm test

            - name: Test if web version compiles
              run: pnpm buildWeb

            - name: Test if plugin structure is valid
              run: pnpm generatePluginJson

            - name: Nightcord unit tests
              run: node --test "test/nightcord/*.test.mjs"
