packages:
    - packages/*

# Dependency versions shared across all packages
catalog:
    "@electron/asar": "^4.2.0"
    "@ffmpeg/ffmpeg": "^0.12.10"
    "@ffmpeg/util": "^0.12.1"
    "@intrnl/xxhash64": "^0.1.2"
    "@song-spotlight/api": "^2.2.0"
    "@streamparser/json": "^0.0.22"
    "@stylistic/eslint-plugin": "^5.10.0"
    "@types/chrome": "^0.3.6"
    "@types/fs-extra": "^11.0.4"
    "@types/node": "^26.0.1"
    "@types/react": "19.2.3"
    "@types/react-dom": "19.2.3"
    "@types/yazl": "^3.3.1"
    "@vap/core": "0.0.12"
    "@vap/shiki": "0.10.5"
    "diff": "^9.0.0"
    "esbuild": "^0.28.2"
    "eslint": "10.13.0"
    "eslint-import-resolver-alias": "^1.1.2"
    "eslint-plugin-react": "^7.37.5"
    "eslint-plugin-simple-header": "^1.2.1"
    "eslint-plugin-simple-import-sort": "^14.0.0"
    "eslint-plugin-unused-imports": "^4.4.1"
    "fflate": "^0.8.3"
    "fs-extra": "^11.3.6"
    "gifenc": "github:mattdesl/gifenc#64842fca317b112a8590f8fef2bf3825da8f6fe3"
    "gifuct-js": "^2.1.2"
    "html-minifier-terser": "^7.2.0"
    "idb": "8.0.3"
    "jsqr": "1.4.0"
    "lodash": "^4.18.1"
    "md5": "^2.3.0"
    "moment": "2.30.1"
    "nanoid": "^5.1.16"
    "native-file-system-adapter": "^3.0.1"
    "p-limit": "^7.3.3"
    "puppeteer-core": "^25.16.0"
    "standalone-electron-types": "^41.2.1"
    "stylelint": "^17.16.0"
    "stylelint-config-standard": "^40.0.0"
    "svgo": "^4.1.0"
    "ts-patch": "^3.3.0"
    "ts-pattern": "^5.9.0"
    "tsx": "^4.23.15"
    "type-fest": "^5.10.0"
    "typescript": "^6.0.3"
    "typescript-eslint": "^8.72.0"
    "typescript-transform-paths": "^3.5.6"
    "yaml-js": "^0.3.1"
    "zip-local": "^0.3.5"
    "@vencord/monaco-editor": "0.57.0-beta.4"

strictPeerDependencies: false
peerDependencyRules:
    ignoreMissing:
        - eslint
        - eslint-plugin-import
allowedDeprecatedVersions:
    q: "*"
    resolve-url: "*"
    source-map-resolve: "*"
    source-map-url: "*"
    urix: "*"

allowBuilds:
    esbuild: true
pmOnFail: warn
verifyDepsBeforeRun: prompt
minimumReleaseAge: 7
minimumReleaseAgeExclude:
    - "@song-spotlight/api"
    - "@nightcord/*"

# Nightcord: patched versions of vulnerable transitive dependencies (pnpm audit).
# None of these are bundled into the client; they come from build and lint tooling.
# Ranges stay within each major line so packages keep the API they expect.
overrides:
    zip-local: "link:./scripts/nightcord/zip-local-shim" # drops jszip 2.x, which has no fixed 2.x release
    moment: "^2.31.0"
    "minimatch@^3.0.0": "^3.1.5"
    "minimatch@^9.0.0": "^9.0.7"
    flatted: "^3.4.2"
    "brace-expansion@^1.0.0": "^1.1.18"
    "brace-expansion@^2.0.0": "^2.1.4"
    "brace-expansion@^5.0.0": "^5.0.9"
    "picomatch@^2.0.0": "^2.3.2"
    "picomatch@^4.0.0": "^4.0.4"
    dompurify: "^3.4.13"
    fast-uri: "^3.1.7"
    postcss: "^8.5.23"
    "nanoid@^3.0.0": "^3.3.18"
    "postcss-selector-parser@^7.0.0": "^7.1.6" # GHSA-rj75-hqrm-r3gf (via stylelint)
    source-map-js: "^1.2.2" # GHSA-68fv-2mgg-jv7q (via stylelint)
    # braces <=3.0.3 (GHSA via stylelint>micromatch) has no fixed release; dev-only, not bundled, patterns are ours.
    js-yaml: "^4.3.2"
    svgo: "^4.1.0"
    colord: "^2.9.4"
